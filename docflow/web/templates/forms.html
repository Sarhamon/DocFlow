{% extends "base.html" %}
{% set nav = "forms" %}
{% block title %}서식 선택{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>서식 선택</h1><p>작성할 서식을 고르면 새 문서를 만들 수 있습니다.</p></div>
</div>
<div class="forms-layout">
  <div class="filter-bar">
    <form class="search" id="search">
      <input type="search" name="q" placeholder="서식 이름, 번호, 카테고리로 찾기" aria-label="검색어">
      <select name="sort" aria-label="정렬">
        <option value="form">서식 번호순</option>
        <option value="title">이름순</option>
        <option value="recent">최근 개정순</option>
      </select>
      <label class="row small"><input type="checkbox" name="archived"> 지난 학년도 서식 포함</label>
      <button class="primary">찾기</button>
    </form>
    <div class="chips" id="programs" aria-label="사업"><span class="muted small">불러오는 중…</span></div>
    <div class="chips sub hidden" id="categories" aria-label="카테고리"></div>
  </div>
  <div class="result-count" id="count"></div>
  <div class="form-cards" id="cards"></div>
  <div id="empty" class="empty card hidden"></div>
  <div class="pager" id="pager"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const { h, api } = DF;
  const state = { q: "", program: "", category: "", sort: "form", archived: "exclude", page: 1, size: 24 };
  const form = document.getElementById("search");

  async function loadFacets() {
    const data = await api("GET", "/api/forms/facets");
    const chip = (label, count, program, category) => {
      const on = state.program === program && state.category === category;
      return h("button", { type: "button", class: on ? "chip on" : "chip", "aria-pressed": String(on), onclick: () => {
        Object.assign(state, { program, category, page: 1 }); loadFacets(); loadForms();
      } }, label, " ", h("span", { class: "count" }, count));
    };
    const total = data.reduce((n, p) => n + p.count, 0);
    document.getElementById("programs").replaceChildren(
      chip("전체", total, "", ""),
      ...data.map((p) => chip(p.program || "(사업 없음)", p.count, p.program, "")));
    const cats = document.getElementById("categories");
    const picked = data.find((p) => state.program && p.program === state.program);
    cats.classList.toggle("hidden", !picked);
    cats.replaceChildren(...(picked ? [chip("전체 카테고리", picked.count, picked.program, ""),
      ...picked.categories.map((c) => chip(`${c.no ?? ""} ${c.name || "(기타)"}`.trim(), c.count, picked.program, c.name))] : []));
  }

  async function loadForms() {
    const params = new URLSearchParams({ sort: state.sort, archived: state.archived, page: state.page, size: state.size });
    for (const k of ["q", "program", "category"]) if (state[k]) params.set(k, state[k]);
    const data = await api("GET", `/api/forms?${params}`);
    document.getElementById("cards").replaceChildren(...data.items.map((f) => h("a", { class: "form-card", href: `/forms/${f.id}` },
      h("span", { class: "no" }, f.form_no || "번호 없음"),
      h("span", { class: "title" }, f.title),
      h("span", { class: "meta" }, [f.program, f.category].filter(Boolean).join(" · "),
        h("span", { class: "spacer" }),
        f.archived ? h("span", { class: "badge" }, "지난 학년도") : null,
        h("span", { class: "badge" }, `v${f.version}`)))));
    document.getElementById("count").textContent = data.total ? `서식 ${data.total}종` : "";
    const empty = document.getElementById("empty");
    empty.classList.toggle("hidden", data.total > 0);
    // 결과 없음 안내 (FM_06)
    empty.textContent = state.q ? `'${state.q}' 에 맞는 서식이 없습니다. 다른 낱말로 찾거나 사업·카테고리 필터를 풀어 보세요.` : "등록된 서식이 없습니다. 관리자에게 서식 등록을 요청하세요.";
    const pages = Math.max(1, Math.ceil(data.total / state.size));
    const pager = document.getElementById("pager");
    pager.replaceChildren();
    if (pages > 1) {
      const go = (p) => () => { state.page = p; loadForms(); window.scrollTo(0, 0); };
      pager.append(h("button", { class: "small", disabled: state.page <= 1, onclick: go(state.page - 1) }, "이전"));
      pager.append(h("span", { class: "muted small", style: "padding:4px 8px" }, `${state.page} / ${pages} (${data.total}건)`));
      pager.append(h("button", { class: "small", disabled: state.page >= pages, onclick: go(state.page + 1) }, "다음"));
    }
  }

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    state.q = form.q.value.trim();
    state.sort = form.sort.value;
    state.archived = form.archived.checked ? "include" : "exclude";
    state.page = 1;
    loadForms().catch(DF.fail);
  });
  form.sort.addEventListener("change", () => form.requestSubmit());
  form.archived.addEventListener("change", () => form.requestSubmit());

  loadFacets().catch(DF.fail);
  loadForms().catch(DF.fail);
})();
</script>
{% endblock %}
