{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>비밀번호 변경</h1>
  <div class="card">
    <div id="msg" class="msg hidden"></div>
    <form id="pw">
      <label class="field"><span>현재 비밀번호</span>
        <input name="current" type="password" autocomplete="current-password" required autofocus></label>
      <label class="field"><span>새 비밀번호</span>
        <input name="new" type="password" autocomplete="new-password" required></label>
      <ul class="rules" id="rules">
        <li data-rule="len">8자 이상</li>
        <li data-rule="upper">대문자 포함</li>
        <li data-rule="lower">소문자 포함</li>
        <li data-rule="digit">숫자 포함</li>
        <li data-rule="special">특수문자 포함</li>
      </ul>
      <label class="field"><span>새 비밀번호 확인</span>
        <input name="confirm" type="password" autocomplete="new-password" required></label>
      <button class="primary" style="width:100%">바꾸기</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const msg = document.getElementById("msg");
  const show = (kind, text) => { msg.className = `msg ${kind}`; msg.textContent = text; };
  if (DF.qs("required")) show("info", "처음 로그인했거나 비밀번호가 초기화되었습니다. 새 비밀번호를 정해야 계속할 수 있습니다.");
  const form = document.getElementById("pw");
  const checks = {
    len: (p) => p.length >= 8,
    upper: (p) => /[A-Z]/.test(p),
    lower: (p) => /[a-z]/.test(p),
    digit: (p) => /[0-9]/.test(p),
    special: (p) => /[!-\/:-@\[-`{-~]/.test(p),
  };
  form.new.addEventListener("input", () => {
    for (const li of document.querySelectorAll("#rules li")) {
      li.classList.toggle("ok", checks[li.dataset.rule](form.new.value));
    }
  });
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (form.new.value !== form.confirm.value) { show("error", "새 비밀번호와 확인이 다릅니다."); return; }
    try {
      await DF.api("POST", "/api/auth/password", { current: form.current.value, new: form.new.value });
      show("ok", "비밀번호를 바꿨습니다.");
      setTimeout(() => { location.href = "/forms"; }, 600);
    } catch (e) { show("error", e.message); }
  });
})();
</script>
{% endblock %}
