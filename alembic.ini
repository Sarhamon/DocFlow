# DB migrations (Alembic). Keep this file ASCII: on Windows Alembic reads it in the locale encoding (cp949).
# DB URL: DOCFLOW_DATABASE_URL, else data/docflow.db. The app upgrades to head on startup
# (docflow.service.db.connect). Use this file to write a new migration:
#   alembic revision --autogenerate -m "what changed"
[alembic]
script_location = %(here)s/docflow/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
